name: ci-cd

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t ghcr.io/josevac1/simulacionexamen:${{ github.sha }} .

      - name: Subir imagen al registry
        run: docker push ghcr.io/josevac1/simulacionexamen:${{ github.sha }}

      - name: Confirmar despliegue
        run: echo "Imagen publicada correctamente en GHCR"
        